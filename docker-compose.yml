name: calorie-tracker

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Local container with persistent storage)
  # When using external Supabase, configure DB_URL in .env instead.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: calorie-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - calorie-net

  # ----------------------------------------------------------------------------
  # Spring Boot 3.4 (Java 21) Backend REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calorie-tracker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://postgres:5432/postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://localhost:80}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/swagger-ui.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 35s
    networks:
      - calorie-net

  # ----------------------------------------------------------------------------
  # Next.js 16 (React 19) Frontend Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: calorie-tracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - calorie-net

  # ----------------------------------------------------------------------------
  # Optional: Nginx Reverse Proxy (Port 80 Ingress)
  # Run with: docker compose --profile nginx up -d
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: calorie-tracker-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles:
      - nginx
    networks:
      - calorie-net

volumes:
  postgres_data:
    driver: local

networks:
  calorie-net:
    driver: bridge
